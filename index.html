<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Штурвал — деньги, команда и клиенты в одном месте</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface2:#F5F8F4; --ink:#13241D; --muted:#5A6B62; --line:#D6DFD8;
  --brand:#0F3D2E; --brand-ink:#EAF2EC; --brass:#C9A227; --in:#1E7A4C; --out:#B3261E; --warn:#A86A00;
  --in-soft:#E3F1E8; --out-soft:#F8E4E2; --warn-soft:#FBF0D6;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1410; --surface:#13201A; --surface2:#182821; --ink:#E5EEE8; --muted:#92A59A; --line:#243830;
    --brand:#0A2A1F; --brand-ink:#E5EEE8; --in:#52C48C; --out:#F07A6E; --warn:#E3B04B;
    --in-soft:#15372A; --out-soft:#3A1D1A; --warn-soft:#3A2F14;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1410; --surface:#13201A; --surface2:#182821; --ink:#E5EEE8; --muted:#92A59A; --line:#243830;
  --brand:#0A2A1F; --brand-ink:#E5EEE8; --in:#52C48C; --out:#F07A6E; --warn:#E3B04B;
  --in-soft:#15372A; --out-soft:#3A1D1A; --warn-soft:#3A2F14;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
aside{background:var(--brand); color:var(--brand-ink); padding:22px 14px; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; display:flex; flex-direction:column; gap:4px}
.logo{font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.01em; padding:4px 10px 18px; display:flex; align-items:center; gap:10px}
.logo svg{flex:none}
.nav button{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:transparent; color:inherit; padding:10px 12px; border-radius:var(--r-sm); font-weight:600; opacity:.78}
.nav button:hover{opacity:1; background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{opacity:1; background:rgba(255,255,255,.1); box-shadow:inset 3px 0 0 var(--brass)}
.nav .badge{margin-left:auto; background:var(--brass); color:#1a1400; font-size:12px; border-radius:20px; padding:0 8px; font-weight:700}
.sync{margin-top:auto; font-size:12px; opacity:.6; padding:0 12px}
main{padding:28px clamp(16px,3vw,40px) 60px; min-width:0; max-width:1240px; width:100%}
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
h1{font-family:var(--display); font-weight:700; font-size:clamp(22px,3vw,30px); line-height:1.15; margin:0; letter-spacing:-.015em}
h2{font-size:17px; margin:0 0 12px; font-weight:700}
.sub{color:var(--muted); margin:4px 0 0}
.btn{border:1px solid var(--line); background:var(--surface); padding:9px 14px; border-radius:var(--r-sm); font-weight:600; display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#EAF2EC}
:root[data-theme="dark"] .btn.primary{background:var(--brass); border-color:var(--brass); color:#1a1400}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{background:var(--brass); border-color:var(--brass); color:#1a1400} }
.btn.ghost{background:transparent; border-color:transparent}
.btn.small{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.5; cursor:default}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; min-width:0}
.hero{background:var(--brand); color:#EAF2EC; border-radius:var(--r-lg); padding:26px 28px; display:grid; grid-template-columns:1.3fr 1fr; gap:24px; align-items:end; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%; border:28px solid rgba(201,162,39,.12)}
.hero .lbl{opacity:.7; font-size:14px}
.hero .big{font-family:var(--display); font-weight:700; font-size:clamp(34px,5.4vw,56px); line-height:1; letter-spacing:-.03em; margin:8px 0 10px; font-variant-numeric:tabular-nums}
.hero .big.neg{color:#FF9D92}
.hero .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; position:relative; z-index:1}
.hero .stats div{border-top:1px solid rgba(255,255,255,.18); padding-top:10px}
.hero .stats b{display:block; font-size:17px; font-variant-numeric:tabular-nums}
.hero .stats span{font-size:12.5px; opacity:.7}
.num{font-variant-numeric:tabular-nums; white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-md); background:var(--surface2); border:0; text-align:left; width:100%}
.alert .dot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex:none; background:var(--in)}
.alert.bad{background:var(--out-soft)} .alert.bad .dot{background:var(--out)}
.alert.warn{background:var(--warn-soft)} .alert.warn .dot{background:var(--warn)}
.alert b{display:block}
.alert small{color:var(--muted)}
.hbar{display:grid; grid-template-columns:130px 1fr auto; gap:10px; align-items:center; font-size:14px; margin:8px 0}
.hbar .track{height:10px; background:var(--surface2); border-radius:6px; overflow:hidden}
.hbar .fill{height:100%; background:var(--brand); border-radius:6px}
:root[data-theme="dark"] .hbar .fill{background:var(--brass)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hbar .fill{background:var(--brass)} }
.hbar .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.inp{border:1px solid var(--line); background:var(--surface); padding:9px 12px; border-radius:var(--r-sm); min-width:0}
.inp.sm{padding:5px 8px; font-size:13.5px}
textarea.inp{resize:vertical}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:14px}
th{font-weight:600; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; white-space:nowrap}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.cp{font-weight:600}
.pp{color:var(--muted); font-size:12.5px; max-width:420px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
tr.unc td{background:var(--warn-soft)}
.xbtn{border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; padding:2px 6px; border-radius:6px}
.xbtn:hover{color:var(--out); background:var(--out-soft)}
.dds td,.dds th{white-space:nowrap}
.dds td:first-child,.dds th:first-child{position:sticky; left:0; background:var(--surface); z-index:1}
.dds tr.sec td{font-weight:700; background:var(--surface2)}
.dds tr.sec td:first-child{background:var(--surface2)}
.dds tr.tot td{font-weight:700}
.dds tr.bal td{font-weight:700; color:var(--brand)}
:root[data-theme="dark"] .dds tr.bal td{color:var(--brass)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dds tr.bal td{color:var(--brass)} }
.kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.col{background:var(--surface2); border-radius:var(--r-lg); padding:12px; min-height:120px}
.col h3{font-size:14px; margin:4px 4px 10px; display:flex; justify-content:space-between; color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px; margin-bottom:10px}
.card .t{font-weight:600}
.card .m{font-size:12.5px; color:var(--muted); margin:4px 0 8px}
.card .m .late{color:var(--out); font-weight:600}
.prio{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 13px; font-size:13.5px}
.chip:hover{border-color:var(--brass)}
.chat{display:flex; flex-direction:column; gap:14px; margin:16px 0}
.msg{max-width:760px; padding:14px 16px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line)}
.msg.me{align-self:flex-end; background:var(--brand); color:#EAF2EC; border-color:var(--brand); max-width:560px}
.msg p{margin:0 0 8px} .msg p:last-child{margin:0}
.msg ul{margin:4px 0 8px; padding-left:20px}
.msg h4{margin:10px 0 4px; font-size:15px}
.composer{display:flex; gap:10px; align-items:flex-end; position:sticky; bottom:0; background:var(--bg); padding:10px 0}
.composer textarea{flex:1; min-height:48px; max-height:180px}
.empty{padding:34px 20px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}
.kpi{font-family:var(--display); font-size:22px; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.muted{color:var(--muted)}
.tag{display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); white-space:nowrap}
.stage-Лид{background:var(--surface2)}
.drop{border:2px dashed var(--line); border-radius:var(--r-lg); padding:18px; text-align:center; color:var(--muted); margin-bottom:14px; transition:border-color .15s, background .15s}
.drop.on{border-color:var(--brass); background:var(--warn-soft)}
.drop b{color:var(--ink)}
/* modal */
.ov{position:fixed; inset:0; background:rgba(5,15,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.modal{background:var(--surface); border-radius:var(--r-lg); padding:22px; width:min(520px,100%); max-height:88vh; overflow:auto; border:1px solid var(--line)}
.modal h2{font-family:var(--display); font-weight:500; font-size:19px}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px; font-size:13.5px; color:var(--muted)}
.field .inp{color:var(--ink); font-size:15px}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.seg button{border:0; background:var(--surface); padding:8px 14px; font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand); color:#EAF2EC}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:var(--r-md); font-weight:600; z-index:60; max-width:92vw; font-size:14px; box-shadow:0 8px 30px rgba(0,0,0,.2)}
.chart text{fill:var(--muted); font-size:11px; font-family:var(--body)}
.legend{display:flex; gap:16px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.spin{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mobnav{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .g2,.g3{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr; padding:22px}
  .kanban{grid-template-columns:1fr}
  .mobnav{display:flex; position:fixed; left:0; right:0; bottom:0; background:var(--brand); color:#EAF2EC; overflow-x:auto; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); gap:2px; z-index:40; scrollbar-width:none}
  .mobnav::-webkit-scrollbar{display:none}
  .mobnav button{flex:1 0 auto; min-width:68px; border:0; background:transparent; color:inherit; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:600; padding:6px 6px; border-radius:10px; opacity:.7; position:relative}
  .mobnav button[aria-current="page"]{opacity:1; background:rgba(255,255,255,.1)}
  .mobnav .badge{position:absolute; top:2px; right:10px; background:var(--brass); color:#1a1400; font-size:10px; border-radius:10px; padding:0 5px}
  .hbar{grid-template-columns:100px 1fr auto}
  .money-table thead{display:none}
  .money-table tr{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 4px; border-bottom:1px solid var(--line)}
  .money-table td{border:0; padding:0}
  .money-table td.d{grid-column:1/-1; font-size:12px; color:var(--muted)}
  .money-table td.c{grid-column:1/-1; margin-top:6px}
  .money-table td.x{grid-row:1; grid-column:2; text-align:right}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="#C9A227" stroke-width="3"/><circle cx="16" cy="16" r="3" fill="#C9A227"/><g stroke="#C9A227" stroke-width="3" stroke-linecap="round"><path d="M16 1v6M16 25v6M1 16h6M25 16h6M5.4 5.4l4.2 4.2M22.4 22.4l4.2 4.2M5.4 26.6l4.2-4.2M22.4 9.6l4.2-4.2"/></g></svg>Штурвал</div>
    <nav class="nav" id="nav"></nav>
    <div class="sync" id="sync">Данные на этом устройстве</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="mobnav" id="mobnav"></nav>
<input type="file" id="file" accept=".txt,.csv,.xlsx,.xls" hidden>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+'\u00A0₽';
const short=n=>{const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',')+'\u00A0млн';if(a>=1e3)return Math.round(n/1e3)+'\u00A0тыс';return Math.round(n)+''};
const id=()=>Math.random().toString(36).slice(2,10);
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const mk=s=>s.slice(0,7);
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const mLabel=k=>MON[+k.slice(5,7)-1]+' '+k.slice(2,4);
const dshort=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
const dfull=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';

/* ============ state ============ */
const CATS={
  in:['Выручка от клиентов','Эквайринг','Займы и кредиты','Возвраты','Прочие поступления'],
  out:['Аренда','ФОТ','Налоги и взносы','Закупка товара','Маркетинг','Логистика','Связь и сервисы','Банк и комиссии','Хозрасходы','Погашение займов','Вывод собственнику','Прочие расходы']
};
const RULES=[
  ['аренд','Аренда'],['заработн','ФОТ'],['зарплат','ФОТ'],['сотрудник','ФОТ'],['налог','Налоги и взносы'],['фнс','Налоги и взносы'],['уфк','Налоги и взносы'],['страхов','Налоги и взносы'],
  ['эквайринг','Эквайринг'],['комисси','Банк и комиссии'],['обслуживан','Банк и комиссии'],['реклам','Маркетинг'],['директ','Маркетинг'],['таргет','Маркетинг'],
  ['связ','Связь и сервисы'],['интернет','Связь и сервисы'],['подписк','Связь и сервисы'],['сдэк','Логистика'],['доставк','Логистика'],['перевоз','Логистика'],
  ['за товар','Закупка товара'],['поставк','Закупка товара'],['личную карту','Вывод собственнику'],['дивиденд','Вывод собственнику'],
  ['оплата по сч','Выручка от клиентов'],['оплата по дог','Выручка от клиентов'],['возврат','Возвраты'],['займ','Займы и кредиты'],['займ','Погашение займов'],['кредит','Займы и кредиты'],['канцтовар','Хозрасходы'],['хоз','Хозрасходы']
].map(([kw,cat])=>({kw,cat}));
const STAGES=['Лид','Переговоры','Счёт выставлен','Оплачено'];
const blank=()=>({company:'Моя компания',startBalance:0,txs:[],cats:JSON.parse(JSON.stringify(CATS)),rules:RULES.slice(),cpRules:{},plan:[],tasks:[],team:[],clients:[],_at:0});

let S=null;
try{const raw=localStorage.getItem('shturval-v1'); if(raw) S=JSON.parse(raw);}catch(e){}
if(!S) S=seed();
const UI={view:'dash',month:'all',dir:'all',cat:'all',q:'',limit:200,year:null,chat:[],busy:false};

/* ============ persistence (device + cloud) ============ */
let dbRef=null,saveTimer=null,saving=false,again=false;
function save(){S._at=Date.now();try{localStorage.setItem('shturval-v1',JSON.stringify(S))}catch(e){} clearTimeout(saveTimer); saveTimer=setTimeout(pushDb,1500);}
async function pushDb(){ if(!dbRef)return; if(saving){again=true;return;} saving=true;
  try{await dbRef.set({json:JSON.stringify(S),at:S._at}); setSync('Сохранено в вашем аккаунте');}catch(e){setSync('Сохранено на этом устройстве');}
  saving=false; if(again){again=false;pushDb();} }
function setSync(t){$('#sync').textContent=t}
async function initCloud(){
  if(!window.claude||!claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef=db.doc('data/users/'+uid+'/app');
    const snap=await dbRef.get();
    if(snap.exists && snap.data() && snap.data().json && (snap.data().at||0)>(S._at||0)){
      S=JSON.parse(snap.data().json); try{localStorage.setItem('shturval-v1',snap.data().json)}catch(e){} render(); setSync('Загружено из вашего аккаунта');
    } else { pushDb(); }
  }catch(e){ setSync('Данные на этом устройстве'); }
}
let _sample; async function getSample(){ if(_sample!==undefined) return _sample; _sample=(window.claude&&claude.use)?await claude.use('sample'):null; return _sample; }

/* ============ demo data ============ */
function seed(){
  const s=blank(); s.company='ООО «Северный ветер»'; s.startBalance=250000; s.demo=true;
  let r=7; const rnd=()=>{r=(r*16807)%2147483647;return (r-1)/2147483646}; const pick=a=>a[Math.floor(rnd()*a.length)];
  const now=new Date(); const T=todayISO();

/* ============ categorization ============ */
function autoCat(t,s=S){
  const key=t.dir+'|'+(t.cp||'').toLowerCase();
  if(s.cpRules[key]) return s.cpRules[key];
  const text=((t.purpose||'')+' '+(t.cp||'')).toLowerCase();
  for(const r of s.rules){ if(text.includes(r.kw) && s.cats[t.dir].includes(r.cat)) return r.cat; }
  return '';
}

const net=t=>t.dir==='in'?t.amount:-t.amount;
function balance(until){ return S.startBalance+S.txs.reduce((a,t)=>(!until||t.date<until)?a+net(t):a,0); }
function monthTotals(k){ let i=0,o=0; const byCat={}; for(const t of S.txs){ if(mk(t.date)!==k) continue; if(t.dir==='in') i+=t.amount; else { o+=t.amount; const c=t.cat||'Не разнесено'; byCat[c]=(byCat[c]||0)+t.amount; } } return {i,o,byCat}; }
function lastMonths(n){ const d=new Date(); const out=[]; for(let k=n-1;k>=0;k--){ const x=new Date(d.getFullYear(),d.getMonth()-k,1); out.push(iso(x).slice(0,7)); } return out; }
function forecast(days){
  const T=todayISO(), end=addDays(T,days); let bal=balance(); const pts=[{date:T,bal}]; let min=bal,minDate=T,gap=null;
  const items=S.plan.filter(p=>!p.done&&p.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  for(const p of items){ bal+=p.dir==='in'?p.amount:-p.amount; const d=p.date<T?T:p.date; pts.push({date:d,bal,p}); if(bal<min){min=bal;minDate=d} if(bal<0&&!gap) gap=d; }
  return {pts,min,minDate,gap,end:bal,endDate:end};
}

function barChart(){
  const ms=lastMonths(6); const data=ms.map(k=>monthTotals(k)); const max=Math.max(1,...data.map(d=>Math.max(d.i,d.o)));

  let g='';
  data.forEach((d,i)=>{ const x=i*gw+gw/2; const hi=(H-pb-10)*d.i/max, ho=(H-pb-10)*d.o/max;
    g+=`<rect x="${x-bw-2}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--in)"><title>Приход ${rub(d.i)}</title></rect><rect x="${x+2}" y="${H-pb-ho}" width="${bw}" height="${ho}" rx="4" fill="var(--out)" opacity=".85"><title>Расход ${rub(d.o)}</title></rect><text x="${x}" y="${H-6}" text-anchor="middle">${mLabel(ms[i])}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Приход и расход за 6 месяцев"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${g}</svg>`;
}

  const W=300,H=140,p=8; const t0=new Date(pts[0].date).getTime(), t1=new Date(fc.endDate).getTime();
  const vals=pts.map(q=>q.bal).concat([0]); const mn=Math.min(...vals), mx=Math.max(...vals); const X=d=>p+(W-2*p)*(new Date(d).getTime()-t0)/Math.max(1,t1-t0); const Y=v=>p+(H-2*p)*(1-(v-mn)/Math.max(1,mx-mn));
  let d=`M${X(pts[0].date)},${Y(pts[0].bal)}`; for(let i=1;i<pts.length;i++){ d+=` H${X(pts[i].date)} V${Y(pts[i].bal)}`; } d+=` H${W-p}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Прогноз остатка"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--out)" stroke-dasharray="4 4" opacity=".6"/><path d="${d}" fill="none" stroke="var(--brass)" stroke-width="2.5"/><circle cx="${X(fc.minDate)}" cy="${Y(fc.min)}" r="4" fill="${fc.min<0?'var(--out)':'var(--brass)'}"/><text x="${p}" y="${H-2}">сегодня</text><text x="${W-p}" y="${H-2}" text-anchor="end">${dshort(fc.endDate)}</text></svg><div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">минимум ${dshort(fc.minDate)}</span><b class="num ${fc.min<0?'out':''}">${rub(fc.min)}</b></div>`;

function ddsMatrix(y,months){
  const idx=Object.fromEntries(months.map((k,i)=>[k,i])); const inM={},outM={};
  const inTot=months.map(()=>0), outTot=months.map(()=>0);
  for(const t of S.txs){ if(!t.date.startsWith(y)) continue; const i=idx[mk(t.date)]; const c=t.cat||'Не разнесено'; const M=t.dir==='in'?inM:outM; (M[c]=M[c]||months.map(()=>0))[i]+=t.amount; (t.dir==='in'?inTot:outTot)[i]+=t.amount; }
  const rows=(M,order)=>[...order.filter(c=>M[c]),...Object.keys(M).filter(c=>!order.includes(c))].map(c=>({c,v:M[c],t:M[c].reduce((a,b)=>a+b,0)}));
  const open=[],close=[],nt=[]; months.forEach((k,i)=>{ const o=balance(k+'-01'); open.push(o); nt.push(inTot[i]-outTot[i]); close.push(o+inTot[i]-outTot[i]); });
  return {inRows:rows(inM,S.cats.in),outRows:rows(outM,S.cats.out),inTot,outTot,net:nt,open,close};
}

function md(s){
  const L=esc(s).split('\n'); let out='',ul=false;
  const inline=x=>x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<b>$1</b>');
  for(let l of L){ const t=l.trim();
    if(/^[-*•]\s+/.test(t)||/^\d+[.)]\s+/.test(t)){ if(!ul){out+='<ul>';ul=true} out+='<li>'+inline(t.replace(/^([-*•]|\d+[.)])\s+/,''))+'</li>'; continue; }
    if(ul){out+='</ul>';ul=false}
    if(/^#{1,4}\s/.test(t)){ out+='<h4>'+inline(t.replace(/^#+\s/,''))+'</h4>'; continue; }
    if(t) out+='<p>'+inline(t)+'</p>';
  }
  if(ul) out+='</ul>'; return out;
}

/* ============ import ============ */
function parseNum(v){ if(typeof v==='number') return v; if(v==null) return NaN; const s=String(v).replace(/\s|\u00A0/g,'').replace(/[^\d,.\-−]/g,'').replace('−','-'); if(!s) return NaN; const t=s.includes(',')&&s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,''); return parseFloat(t); }
function parseDate(v){
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v==='number' && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s=String(v||'').trim(); let m=s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/); if(m){ let y=+m[3]; if(y<100)y+=2000; return y+'-'+z(m[2])+'-'+z(m[1]); }
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3]; return '';
}
function cleanCp(s){ return String(s||'').replace(/^ИНН\s*\d+\s*/i,'').replace(/\s+/g,' ').trim(); }
function parse1C(text){
  const own=new Set(); let doc=null; const docs=[];
  for(const raw of text.split(/\r?\n/)){ const l=raw.trim(); const i=l.indexOf('='); const k=i>0?l.slice(0,i):l; const v=i>0?l.slice(i+1).trim():'';
    if(k==='РасчСчет') own.add(v); else if(k==='СекцияДокумент') doc={}; else if(k==='КонецДокумента'){ if(doc) docs.push(doc); doc=null; } else if(doc) doc[k]=v; }
  return docs.map(d=>{ const payer=d['ПлательщикСчет']||d['ПлательщикРасчСчет']; let dir;
    if(own.size) dir=own.has(payer)?'out':'in'; else dir=d['ДатаСписано']?'out':'in';
    const cp=dir==='out'?(d['Получатель1']||d['Получатель']):(d['Плательщик1']||d['Плательщик']);
    return {date:parseDate(d['ДатаСписано']||d['ДатаПоступило']||d['Дата']),amount:Math.abs(parseNum(d['Сумма'])),dir,cp:cleanCp(cp),purpose:d['НазначениеПлатежа']||''}; });
}
function parseCSV(text){
  const first=text.split(/\r?\n/).slice(0,10).join('\n'); const cnt=c=>first.split(c).length; const del=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; }
    else if(c==='"') q=true; else if(c===del){row.push(cell);cell=''} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''} else if(c!=='\r') cell+=c; }
  if(cell||row.length){row.push(cell);rows.push(row)} return rows;
}
function parseTable(rows){
  let hi=-1; for(let i=0;i<Math.min(rows.length,40);i++){ const r=rows[i].map(x=>String(x).toLowerCase()); if(r.some(x=>x.includes('дата'))&&r.some(x=>/сумм|приход|расход|дебет|кредит|поступ|списан/.test(x))){hi=i;break} }
  if(hi<0) throw new Error('Не нашли строку с заголовками «Дата» и «Сумма». Проверьте, что это выписка по счёту.');
  const H=rows[hi].map(x=>String(x).toLowerCase().trim()); const f=re=>H.findIndex(h=>re.test(h));
  const cDate=f(/дата (операц|провод|плат)/)>=0?f(/дата (операц|провод|плат)/):f(/дата/);
  const cIn=f(/приход|поступ|кредит|зачисл/), cOut=f(/расход|списан|дебет/), cSum=f(/сумм/);
  const cDir=f(/тип|направл|вид операц/);
  const cCp=f(/контрагент|корреспондент|получатель|плательщик|наименование/); const cPur=f(/назначен|описан|комментар|основание|детали/);
  const out=[];
  for(const r of rows.slice(hi+1)){ const date=parseDate(r[cDate]); if(!date) continue; let dir,amount;
    const vi=cIn>=0?parseNum(r[cIn]):NaN, vo=cOut>=0?parseNum(r[cOut]):NaN;
    if(vi>0){dir='in';amount=vi} else if(vo>0){dir='out';amount=vo}
    else if(cSum>=0){ const v=parseNum(r[cSum]); if(!v) continue; const dt=cDir>=0?String(r[cDir]).toLowerCase():''; if(/спис|расх|debit/.test(dt)) {dir='out'} else if(/зачисл|приход|поступ|credit/.test(dt)) dir='in'; else dir=v<0?'out':'in'; amount=Math.abs(v); }
    else continue;
    out.push({date,amount,dir,cp:cleanCp(cCp>=0?r[cCp]:''),purpose:cPur>=0?String(r[cPur]||''):''}); }
  return out;
}

async function ask(question){

  const sample=await getSample(); if(!sample){ toast('ИИ-помощник в этой версии работает только внутри Claude. В полной версии он будет подключён к серверу.'); return; }
  UI.chat.push({role:'user',content:question}); UI.chat.push({role:'assistant',content:''}); UI.busy=true; render();
  const box=[...document.querySelectorAll('.msg')].pop(); box.innerHTML='<span class="spin"></span> Думаю над вашими цифрами…'; box.scrollIntoView({block:'end'});
  const intro='Ты — финансовый директор и бизнес-наставник для владельца малого бизнеса в России. Отвечай по-русски, коротко и конкретно, опираясь на цифры из данных ниже (суммы в рублях). Давай 3–5 практичных шагов. Если данных не хватает — скажи, чего именно. Не выдумывай цифры. Не используй таблицы.\n\nДАННЫЕ БИЗНЕСА:\n'+context();
  const hist=UI.chat.slice(0,-1).slice(-8).map(m=>({role:m.role,content:m.content}));
  hist[hist.length-1]={role:'user',content:intro+'\n\nВОПРОС: '+question};
  abortCtl=new AbortController();
  try{
    const res=await sample(hist,{signal:abortCtl.signal,cache:false,onText:({text})=>{UI.chat[UI.chat.length-1].content=text; box.innerHTML=md(text);}});
    UI.chat[UI.chat.length-1].content=res.text;
  }catch(e){ const keep=e&&e.text; UI.chat[UI.chat.length-1].content=keep||({not_granted:'Доступ к ИИ не разрешён. Разрешите его при следующем вопросе.',rate_limited:'Слишком много запросов подряд. Подождите минуту.',cancelled:'Остановлено.'}[e&&e.code]||'Не удалось получить ответ. Попробуйте ещё раз.'); }
  UI.busy=false; abortCtl=null; render(); const last=[...document.querySelectorAll('.msg')].pop(); if(last) last.scrollIntoView({block:'end'});

async function aiCategorize(){
  if(UI.busy) return; const sample=await getSample(); if(!sample){ toast('Разнесение с ИИ в этой версии работает только внутри Claude. Статьи можно проставить вручную.'); return; }
  const list=S.txs.filter(t=>!t.cat).slice(0,80); if(!list.length) return toast('Все операции уже разнесены');
  UI.busy=true; render();
  const prompt=`Ты бухгалтер. Разнеси банковские операции российской компании по статьям ДДС.
Статьи поступлений (dir=in): ${JSON.stringify(S.cats.in)}

  if(d.del){ S.txs=S.txs.filter(x=>x.id!==d.del); save(); render(); return; }
  if(d.delplan){ S.plan=S.plan.filter(x=>x.id!==d.delplan); save(); render(); return; }
  if(d.paid){ const p=S.plan.find(x=>x.id===d.paid); p.done=true; S.txs.push({id:id(),date:todayISO(),dir:p.dir,amount:p.amount,cp:p.cp,purpose:p.note||'',cat:p.cat,src:'календарь'}); S.txs.sort((a,b)=>b.date.localeCompare(a.date)); save(); render(); toast('Перенесено в операции'); return; }
  if(d.move){ const x=S.tasks.find(y=>y.id===d.move); x.status={todo:'doing',doing:'done',done:'todo'}[x.status]; save(); render(); return; }
  if(d.deltask){ S.tasks=S.tasks.filter(x=>x.id!==d.deltask); save(); render(); return; }
  if(d.delmember){ S.team=S.team.filter(x=>x.id!==d.delmember); save(); render(); return; }
  if(d.delclient){ S.clients=S.clients.filter(x=>x.id!==d.delclient); save(); render(); return; }
  if(d.toplan){ const c=S.clients.find(x=>x.id===d.toplan); addPlan({dir:'in',amount:c.amount,cp:c.name,cat:'Выручка от клиентов',note:'Оплата по выставленному счёту'}); return; }
  if(d.ask){ go('ai'); ask(d.ask); return; }
  if(d.addcat){ const inp=$('#nc-'+d.addcat); const v=inp.value.trim(); if(v&&!S.cats[d.addcat].includes(v)){S.cats[d.addcat].push(v);save();render()} return; }
  if(d.delcat){ const [dir,c]=d.delcat.split('|'); S.cats[dir]=S.cats[dir].filter(x=>x!==c); save(); render(); return; }
  if(d.delrule){ delete S.cpRules[d.delrule]; save(); render(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cat){ const tx=S.txs.find(x=>x.id===t.dataset.cat); tx.cat=t.value; let n=0;
    if(t.value&&tx.cp){ S.cpRules[tx.dir+'|'+tx.cp.toLowerCase()]=t.value; S.txs.forEach(x=>{ if(!x.cat&&x.dir===tx.dir&&(x.cp||'').toLowerCase()===tx.cp.toLowerCase()){x.cat=t.value;n++} }); }
    save(); if(t.value&&tx.cp) toast(`Запомнила: ${tx.cp} → ${t.value}${n?`. Ещё ${n} операций разнесены`:''}`);
    if(n||UI.cat==='none') render(); else { t.closest('tr').classList.toggle('unc',!t.value); renderNav(); }
    return; }
  if(t.dataset.f){ UI[t.dataset.f]=t.value; UI.limit=200; render(); return; }
  if(t.dataset.stage){ const c=S.clients.find(x=>x.id===t.dataset.stage); c.stage=t.value; save(); render(); if(t.value==='Счёт выставлен') toast('Поставьте ожидаемую оплату в календарь — кнопка «В календарь»'); return; }
});
let qt; document.addEventListener('input',e=>{ if(e.target.id==='q-search'){ clearTimeout(qt); qt=setTimeout(()=>{UI.q=e.target.value;UI.limit=200;const pos=e.target.selectionStart;render();const i=$('#q-search');i.focus();i.setSelectionRange(pos,pos)},250); } });
document.addEventListener('keydown',e=>{ if(e.target.id==='q'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(e.target.value); } });
$('#file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importFile(f); e.target.value=''; });
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){ e.preventDefault(); const d=$('#drop'); if(d) d.classList.add('on'); } }));
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget){ const d=$('#drop'); if(d) d.classList.remove('on'); } });
document.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length){ e.preventDefault(); const d=$('#drop'); if(d) d.classList.remove('on'); importFile(e.dataTransfer.files[0]); } });

render();
initCloud();
</script>
</body>
</html>
